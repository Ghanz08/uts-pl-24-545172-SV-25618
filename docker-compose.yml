# IdeaVault: MySQL + Laravel (FrankenPHP) + Vue (Nginx).
# Run everything with:  docker compose up -d --build
# Credentials come from ./.env (not committed); copy .env.example to start.
name: ideavault

services:
  db:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ideavault}
      MYSQL_USER: ${DB_USERNAME:-ideavault}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD wajib diisi di .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    image: ideavault-backend:local
    restart: unless-stopped
    environment:
      APP_NAME: IdeaVault
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
      APP_URL: http://localhost:${FRONTEND_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: db # service name, not a laptop IP
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ideavault}
      DB_USERNAME: ${DB_USERNAME:-ideavault}
      DB_PASSWORD: ${DB_PASSWORD}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@ideavault.test}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-password123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Exposed only so Postman can hit the API directly; the browser goes through the frontend.
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: ideavault-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8000 # service name on the Compose network
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
